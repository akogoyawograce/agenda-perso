name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Build APK (debug)
        continue-on-error: true
        run: |
          flutter build apk --debug --dart-define=API_URL=https://dull-ape-13.loca.lt/api 2>&1 | tee build.log || true

      - name: Show build errors
        if: always()
        run: |
          echo "=== Dernières 60 lignes ==="
          tail -60 build.log 2>/dev/null || echo "build.log introuvable"
          echo "=== APK trouvés ==="
          find build -name "*.apk" 2>/dev/null || echo "Aucun APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agenda-perso-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
